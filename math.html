<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6c5ce7">
  <meta name="description" content="A fun math practice app for kids!">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Math Hero">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <title>Math Hero - Fun Math for Kids!</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- Start Screen -->
    <div id="screen-start" class="screen active">
      <div class="start-content">
        <h1 class="app-title">Math Hero</h1>
        <p class="app-subtitle">Become a Math Superstar!</p>

        <div class="menu-section">
          <h2>Choose Your Challenge</h2>
          <div class="operation-grid">
            <button class="op-btn" data-op="addition">
              <span class="op-icon">+</span>
              <span class="op-label">Addition</span>
            </button>
            <button class="op-btn" data-op="subtraction">
              <span class="op-icon">−</span>
              <span class="op-label">Subtraction</span>
            </button>
            <button class="op-btn" data-op="multiplication">
              <span class="op-icon">×</span>
              <span class="op-label">Multiplication</span>
            </button>
            <button class="op-btn" data-op="division">
              <span class="op-icon">÷</span>
              <span class="op-label">Division</span>
            </button>
            <button class="op-btn op-btn-mix" data-op="mixed">
              <span class="op-icon">?</span>
              <span class="op-label">Mixed</span>
            </button>
          </div>
        </div>

        <div class="menu-section">
          <h2>Difficulty</h2>
          <div class="difficulty-buttons">
            <button class="diff-btn active" data-diff="easy">Easy</button>
            <button class="diff-btn" data-diff="medium">Medium</button>
            <button class="diff-btn" data-diff="hard">Hard</button>
          </div>
        </div>

        <div class="menu-section">
          <h2>Questions</h2>
          <div class="difficulty-buttons">
            <button class="count-btn active" data-count="10">10</button>
            <button class="count-btn" data-count="20">20</button>
            <button class="count-btn" data-count="50">50</button>
          </div>
        </div>

        <button id="btn-start" class="btn-primary" disabled>Start!</button>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="screen-game" class="screen">
      <div class="game-header">
        <div class="game-stat">
          <span class="stat-label">Score</span>
          <span id="score" class="stat-value">0</span>
        </div>
        <div class="game-stat">
          <span class="stat-label">Question</span>
          <span id="progress" class="stat-value">1/10</span>
        </div>
        <div class="game-stat">
          <span class="stat-label">Streak</span>
          <span id="streak" class="stat-value">0</span>
        </div>
      </div>

      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <div class="question-area">
        <div id="feedback-area" class="feedback-area"></div>
        <div id="question" class="question-text">5 × 3 = ?</div>
      </div>

      <div id="answer-area" class="answer-area">
        <div class="answer-options" id="answer-options"></div>
      </div>

      <div class="game-footer">
        <button id="btn-quit" class="btn-secondary">Quit</button>
      </div>
    </div>

    <!-- Results Screen -->
    <div id="screen-results" class="screen">
      <div class="results-content">
        <div id="results-emoji" class="results-emoji"></div>
        <h1 id="results-title" class="results-title">Great Job!</h1>
        <p id="results-subtitle" class="results-subtitle"></p>

        <div class="results-stats">
          <div class="result-stat">
            <span class="result-stat-value" id="result-score">0</span>
            <span class="result-stat-label">Score</span>
          </div>
          <div class="result-stat">
            <span class="result-stat-value" id="result-correct">0</span>
            <span class="result-stat-label">Correct</span>
          </div>
          <div class="result-stat">
            <span class="result-stat-value" id="result-accuracy">0%</span>
            <span class="result-stat-label">Accuracy</span>
          </div>
          <div class="result-stat">
            <span class="result-stat-value" id="result-best-streak">0</span>
            <span class="result-stat-label">Best Streak</span>
          </div>
        </div>

        <div id="results-review" class="results-review">
          <h2>Review Mistakes</h2>
          <div id="mistakes-list" class="mistakes-list"></div>
        </div>

        <div class="results-buttons">
          <button id="btn-play-again" class="btn-primary">Play Again</button>
          <button id="btn-home" class="btn-secondary">Home</button>
        </div>
      </div>
    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
